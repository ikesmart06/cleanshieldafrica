<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300" width="100%" height="100%">
  <defs>
    <!-- Background Circle Diagonal Gradient: Purple to Blue -->
    <linearGradient id="bgGrad" x1="20%" y1="20%" x2="80%" y2="80%">
      <stop offset="0%" stop-color="#8a3782"/>
      <stop offset="42%" stop-color="#732b70"/>
      <stop offset="58%" stop-color="#0e5fb8"/>
      <stop offset="100%" stop-color="#0052b3"/>
    </linearGradient>

    <!-- Shield Gradient -->
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1976d2"/>
      <stop offset="50%" stop-color="#0d47a1"/>
      <stop offset="100%" stop-color="#0a3880"/>
    </linearGradient>

    <!-- Text Gradient for CleanShield -->
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0080ff"/>
      <stop offset="100%" stop-color="#003580"/>
    </linearGradient>

    <!-- Arc Paths for curved text -->
    <!-- Top arc for CELEBRATE A HEALTHY LIFE -->
    <path id="topTextArc" d="M 38,150 A 112,112 0 0,1 262,150" fill="none" />
    
    <!-- Bottom arc for LIQUID SUPPLEMENT -->
    <path id="bottomTextArc" d="M 52,150 A 98,98 0 0,0 248,150" fill="none" />
    
    <!-- Filter for soft glow / shadow -->
    <filter id="softShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
    <filter id="textGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="1.5" flood-color="#002255" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Outer Top Text: CELEBRATE A HEALTHY LIFE -->
  <text font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="14.5" fill="#4d1b54" letter-spacing="3.2">
    <textPath href="#topTextArc" startOffset="50%" text-anchor="middle">
      CELEBRATE A HEALTHY LIFE
    </textPath>
  </text>

  <!-- Central Main Badge Circle -->
  <circle cx="150" cy="150" r="105" fill="url(#bgGrad)" stroke="#ffffff" stroke-width="3" filter="url(#softShadow)" />

  <!-- Shield Shape (Behind Text & Wreath) -->
  <g filter="url(#softShadow)">
    <!-- Outer White Shield Rim -->
    <path d="M 150,78 
             C 188,78 206,94 206,132 
             C 206,174 175,206 150,224 
             C 125,206 94,174 94,132 
             C 94,94 112,78 150,78 Z" 
          fill="#ffffff" />

    <!-- Inner Blue Shield -->
    <path d="M 150,85 
             C 182,85 198,98 198,132 
             C 198,168 170,197 150,214 
             C 130,197 102,168 102,132 
             C 102,98 118,85 150,85 Z" 
          fill="url(#shieldGrad)" />

    <!-- White Crossing Beams (Diagonal X inside shield) -->
    <g stroke="#ffffff" stroke-width="4.5" stroke-linecap="round" opacity="0.95">
      <line x1="114" y1="102" x2="186" y2="182" />
      <line x1="186" y1="102" x2="114" y2="182" />
    </g>

    <!-- Starburst Glint / Sparkle at center of cross -->
    <g transform="translate(150, 142)">
      <!-- 4-point primary star -->
      <path d="M 0,-15 Q 0,0 15,0 Q 0,0 0,15 Q 0,0 -15,0 Q 0,0 0,-15 Z" fill="#ffffff" />
      <!-- Diagonal subtle rays -->
      <path d="M -7,-7 L 7,7 M -7,7 L 7,-7" stroke="#ffffff" stroke-width="2" stroke-linecap="round" />
      <circle cx="0" cy="0" r="3" fill="#ffffff" />
    </g>
  </g>

  <!-- Laurel Wreath Around Lower Shield -->
  <g fill="#0077e6" stroke="#ffffff" stroke-width="1.2" filter="url(#softShadow)">
    <!-- Left Branch Leaves -->
    <path d="M 92,152 C 84,146 76,155 82,163 C 86,169 94,166 94,158 Z" />
    <path d="M 80,165 C 72,160 66,170 72,178 C 77,184 85,180 84,172 Z" />
    <path d="M 75,183 C 68,180 64,191 71,198 C 77,204 85,198 83,190 Z" />
    <path d="M 79,202 C 74,201 72,212 80,218 C 87,222 94,215 91,208 Z" />
    <path d="M 92,220 C 88,221 89,232 98,236 C 105,238 111,230 106,224 Z" />
    <path d="M 112,234 C 110,237 114,246 123,247 C 131,248 134,239 128,235 Z" />
    <path d="M 134,242 C 134,246 142,252 149,249 C 154,247 154,239 147,238 Z" />

    <!-- Right Branch Leaves -->
    <path d="M 208,152 C 216,146 224,155 218,163 C 214,169 206,166 206,158 Z" />
    <path d="M 220,165 C 228,160 234,170 228,178 C 223,184 215,180 216,172 Z" />
    <path d="M 225,183 C 232,180 236,191 229,198 C 223,204 215,198 217,190 Z" />
    <path d="M 221,202 C 226,201 228,212 220,218 C 213,222 206,215 209,208 Z" />
    <path d="M 208,220 C 212,221 211,232 202,236 C 195,238 189,230 194,224 Z" />
    <path d="M 188,234 C 190,237 186,246 177,247 C 169,248 166,239 172,235 Z" />
    <path d="M 166,242 C 166,246 158,252 151,249 C 146,247 146,239 153,238 Z" />
    
    <!-- Central Ribbon / Bow Base -->
    <circle cx="150" cy="245" r="4.5" fill="#0055b3" stroke="#ffffff" stroke-width="1.5"/>
  </g>

  <!-- CleanShield Arced Brand Text Overlay -->
  <g transform="translate(150, 96)" text-anchor="middle">
    <!-- Drop Shadow / Thick Outline -->
    <text font-family="'Arial Black', 'Impact', system-ui, sans-serif" font-style="italic" font-weight="900" font-size="28" fill="#ffffff" stroke="#ffffff" stroke-width="7" stroke-linejoin="round" letter-spacing="-0.5">
      CleanShield
    </text>
    <!-- Dark Outline Shadow -->
    <text font-family="'Arial Black', 'Impact', system-ui, sans-serif" font-style="italic" font-weight="900" font-size="28" fill="#004085" stroke="#003366" stroke-width="2" stroke-linejoin="round" letter-spacing="-0.5">
      CleanShield
    </text>
    <!-- Foreground Text Gradient Fill -->
    <text font-family="'Arial Black', 'Impact', system-ui, sans-serif" font-style="italic" font-weight="900" font-size="28" fill="url(#textGrad)" letter-spacing="-0.5">
      CleanShield
    </text>
  </g>

  <!-- Outer Bottom Text: LIQUID SUPPLEMENT -->
  <text font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="14.5" fill="#0c1d36" letter-spacing="3.5">
    <textPath href="#bottomTextArc" startOffset="50%" text-anchor="middle">
      LIQUID SUPPLEMENT
    </textPath>
  </text>
</svg>
